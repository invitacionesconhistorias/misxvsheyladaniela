<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invitación suspendida</title>
<meta property="og:title" content="Invitación suspendida">
<meta property="og:description" content="Esta invitación no está disponible por falta de pago.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ecf9;--card:#fdfaff;--ol:#4a2172;--oro:#c9a84c;--tx:#3d2255;--mut:#6b4a85}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(160deg,#efe2f8,#fdfaff 50%,#e6d4f2);color:var(--tx);font-family:'Cormorant Garamond',Georgia,serif;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.card{max-width:420px;width:100%;background:var(--card);border:1px solid rgba(184,149,90,.5);border-radius:20px;padding:2.4rem 1.6rem 2rem;text-align:center;box-shadow:0 0 0 6px rgba(255,255,255,.6),0 16px 36px rgba(123,63,160,.18)}
.ic{width:56px;height:56px;margin:0 auto 1rem;color:var(--oro)}
h1{font-family:'Cinzel',serif;font-weight:500;letter-spacing:.18em;font-size:1.05rem;line-height:1.6;color:var(--ol)}
.line{width:120px;height:1px;margin:1rem auto;background:linear-gradient(90deg,transparent,var(--oro),transparent)}
p{font-size:1.18rem;line-height:1.55}
.mut{color:var(--mut);font-style:italic;margin-top:.8rem;font-size:1.08rem}
.brand{margin-top:1.8rem;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.22em;color:var(--mut)}
.brand b{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:1.25rem;letter-spacing:0;color:var(--ol);margin-top:.2rem}
.links{display:flex;justify-content:center;gap:.7rem;margin-top:.7rem}
.links a{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(184,149,90,.6);color:var(--ol)}
.links svg{width:18px;height:18px}
</style>
</head>
<body>
<main class="card">
  <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 8l9 6 9-6"/><path d="M12 2v2"/></svg>
  <h1>INVITACIÓN<br>NO DISPONIBLE</h1>
  <div class="line"></div>
  <p>Esta invitación se encuentra suspendida por falta de pago.</p>
  <p class="mut">Para reanudarla, finaliza el pago.</p>
  <div class="brand">HECHO POR<b>Invitaciones con Historias</b>
    <div class="links">
      <a href="https://www.instagram.com/invitacionesconhistorias/?hl=es-la" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor"/></svg></a>
      <a href="https://wa.link/24sddr" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg></a>
    </div>
  </div>
</main>
</body>
</html>
